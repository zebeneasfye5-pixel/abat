<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4A0E17"/>
      <stop offset="85%" stop-color="#1A0508"/>
      <stop offset="100%" stop-color="#0E0204"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE885"/>
      <stop offset="35%" stop-color="#E5B942"/>
      <stop offset="70%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8C6203"/>
    </linearGradient>
    <linearGradient id="ruby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B22234"/>
      <stop offset="100%" stop-color="#6B0C1A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)" stroke="url(#gold)" stroke-width="8"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Holy Radiance Rays -->
  <g opacity="0.35" stroke="url(#gold)" stroke-width="1.5">
    <line x1="256" y1="36" x2="256" y2="476"/>
    <line x1="36" y1="256" x2="476" y2="256"/>
    <line x1="100" y1="100" x2="412" y2="412"/>
    <line x1="100" y1="412" x2="412" y2="100"/>
  </g>

  <!-- Traditional Ethiopian Orthodox Cross (መስቀል) Motif -->
  <g filter="url(#glow)">
    <!-- Central vertical shaft -->
    <rect x="236" y="90" width="40" height="332" rx="4" fill="url(#gold)"/>
    <!-- Central horizontal beam -->
    <rect x="110" y="210" width="292" height="40" rx="4" fill="url(#gold)"/>

    <!-- Central Diamond Core -->
    <polygon points="256,170 316,230 256,290 196,230" fill="url(#ruby)" stroke="url(#gold)" stroke-width="6"/>
    <circle cx="256" cy="230" r="16" fill="url(#gold)"/>

    <!-- Top Cross Head with Filigree Finials -->
    <rect x="220" y="60" width="72" height="30" rx="4" fill="url(#gold)"/>
    <circle cx="256" cy="50" r="16" fill="url(#gold)"/>
    <circle cx="220" cy="75" r="10" fill="url(#gold)"/>
    <circle cx="292" cy="75" r="10" fill="url(#gold)"/>

    <!-- Bottom Base Ring / Stand -->
    <rect x="216" y="422" width="80" height="30" rx="4" fill="url(#gold)"/>
    <circle cx="256" cy="460" r="14" fill="url(#gold)"/>
    <circle cx="216" cy="437" r="8" fill="url(#gold)"/>
    <circle cx="296" cy="437" r="8" fill="url(#gold)"/>

    <!-- Left & Right Beam Finials -->
    <rect x="80" y="196" width="30" height="68" rx="4" fill="url(#gold)"/>
    <circle cx="70" cy="230" r="16" fill="url(#gold)"/>
    <circle cx="95" cy="196" r="8" fill="url(#gold)"/>
    <circle cx="95" cy="264" r="8" fill="url(#gold)"/>

    <rect x="402" y="196" width="30" height="68" rx="4" fill="url(#gold)"/>
    <circle cx="442" cy="230" r="16" fill="url(#gold)"/>
    <circle cx="417" cy="196" r="8" fill="url(#gold)"/>
    <circle cx="417" cy="264" r="8" fill="url(#gold)"/>

    <!-- Intricate Diagonal Lattice Intersections -->
    <circle cx="196" cy="170" r="12" fill="url(#gold)"/>
    <circle cx="316" cy="170" r="12" fill="url(#gold)"/>
    <circle cx="196" cy="290" r="12" fill="url(#gold)"/>
    <circle cx="316" cy="290" r="12" fill="url(#gold)"/>
  </g>
</svg>
